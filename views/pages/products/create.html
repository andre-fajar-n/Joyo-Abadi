<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Create New Product</h4>
                </div>
                <div class="card-body">
                    {{ if .Error }}
                    <div class="alert alert-danger">{{ .Error }}</div>
                    {{ end }}
                    
                    <form method="POST" action="/products/create">
                        <div class="mb-3">
                            <label for="name" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ if .Product }}{{ .Product.Name }}{{ end }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="price" class="form-label">Price (Rp)</label>
                            <input type="number" class="form-control" id="price" name="price" value="{{ if .Product }}{{ .Product.Price }}{{ end }}" min="0" step="0.01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ if .Product }}{{ .Product.Quantity }}{{ else }}0{{ end }}" min="0" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ if .Product }}{{ .Product.Description }}{{ end }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="/products" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
